version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mascotasmorelia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=aPERRITOMAN12
    ports:
      - "5433:5432" # Expone el puerto por si quieres conectarte desde tu pgAdmin local (usando 5433 para no chocar con el 5432 de tu compu)

  web:
    build: .
    command: gunicorn MascotasMorelia.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DB_NAME=mascotasmorelia
      - DB_USER=postgres
      - DB_PASSWORD=aPERRITOMAN12
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=MascotasMorelia.settings
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
