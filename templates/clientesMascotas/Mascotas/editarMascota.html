{% extends 'base.html' %}

{% block title %}Editar Mascota{% endblock %}

{% block content %}
<section class="container">
    <h2>Editar Mascota</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Campo personalizado de cliente -->
        <label for="cliente">Seleccionar Cliente:</label>
        <input type="text" id="cliente-search" placeholder="Buscar cliente por nombre, correo o teléfono" class="search-input">

        <select id="cliente" name="cliente" class="searchable-dropdown">
            <option value="">Seleccione un cliente</option>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}" {% if cliente.id == form.instance.cliente.id %}selected{% endif %}>
                {{ cliente.nombre }} - {{ cliente.email }} - {{ cliente.telefono }}
            </option>
            {% endfor %}
        </select>

        <!-- Campos del formulario (sin cliente, ya vienen con valores) -->
        {{ form.as_p }}

        <button type="submit" class="btn-home">Guardar Cambios</button>
    </form>
</section>

<!-- Buscador dinámico -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('cliente-search');
    const dropdown = document.getElementById('cliente');

    searchInput.addEventListener('input', function() {
        const filter = searchInput.value.toLowerCase().replace(/\s+/g, '');
        const options = dropdown.querySelectorAll('option');
        options.forEach(option => {
            const text = option.textContent.toLowerCase().replace(/\s+/g, '');
            option.style.display = text.includes(filter) ? '' : 'none';
        });
    });
});
</script>
{% endblock %}
