{% load static %}
<style>
.filter-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

.filter-form {
    display: flex;
    align-items: center;
    background-color: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 25px;
    padding: 5px 15px;
    transition: all 0.3s ease;
    width: 100%;
    max-width: 800px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.filter-form:focus-within {
    border-color: #3498db;
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
}

.filter-input {
    border: none;
    outline: none;
    padding: 10px 16px;
    font-size: 16px;
    flex-grow: 1;
    min-width: 0;
    border-radius: 25px;
    background: transparent;
    color: #333;
}

.filter-input::placeholder {
    color: #999;
}

.filter-button {
    background: #3498db;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    margin-left: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    transition: all 0.3s ease;
}

.filter-button:hover {
    background: #2980b9;
    transform: scale(1.05);
}

.filter-button:active {
    transform: scale(0.95);
}

.filter-icon {
    font-size: 18px;
    color: white;
}


</style>
<div class="filter-container">
    <form method="get" action="" class="filter-form">
        <input type="text" name="q" placeholder="{{ placeholder }}" class="filter-input" value="{{ request.GET.q }}">
        <button type="submit" class="filter-button" title="Buscar">
            <span class="filter-icon">🔍</span>
            <!-- Alternativa con SVG:
            <svg class="filter-svg" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            -->
        </button>
    </form>
</div>
