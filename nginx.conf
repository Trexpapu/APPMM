upstream web_app {
    server web:8000;
}

server {
    listen 80;

    client_max_body_size 20M; # Para permitir subir fotos grandes

    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
